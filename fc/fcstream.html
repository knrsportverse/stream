<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FanCode Live Sports Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .pulse-live { animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="glass-card sticky top-0 z-50 px-6 py-4 border-b border-gray-800">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-bolt text-red-500 text-3xl"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide text-white">FANCODE LIVE HUB</h1>
          <p id="updated-time" class="text-xs text-gray-400">Loading live data...</p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="relative w-full md:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
          <input type="text" id="search-input" placeholder="Search match or tournament..." class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-red-500 transition" />
        </div>
        <button onclick="fetchMatches()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
      </div>
    </div>
  </header>

  <!-- Filter Bar -->
  <main class="max-w-7xl mx-auto px-6 py-6 flex-grow w-full">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-2 overflow-x-auto pb-2" id="category-filters">
        <button class="cat-btn active bg-red-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold" onclick="filterCategory('ALL')">All</button>
        <button class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-1.5 rounded-full text-xs font-semibold" onclick="filterCategory('Cricket')">Cricket</button>
        <button class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-1.5 rounded-full text-xs font-semibold" onclick="filterCategory('Football')">Football</button>
        <button class="cat-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-1.5 rounded-full text-xs font-semibold" onclick="filterCategory('Tennis')">Tennis</button>
      </div>
      <div class="flex items-center gap-2">
        <button class="status-btn bg-gray-800 text-gray-300 px-3 py-1.5 rounded-md text-xs font-medium" onclick="filterStatus('ALL')">All Status</button>
        <button class="status-btn bg-red-950 text-red-400 border border-red-800/50 px-3 py-1.5 rounded-md text-xs font-medium" onclick="filterStatus('LIVE')">🔴 LIVE</button>
        <button class="status-btn bg-gray-800 text-gray-300 px-3 py-1.5 rounded-md text-xs font-medium" onclick="filterStatus('UPCOMING')">📅 Upcoming</button>
      </div>
    </div>

    <!-- Match Grid -->
    <div id="match-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <script>
    const API_URL = "https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/main/fancode.json";
    let matchesData = [];
    let currentCategory = 'ALL';
    let currentStatus = 'ALL';

    async function fetchMatches() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        matchesData = data.matches || [];
        document.getElementById('updated-time').innerText = `Updated: ${data.updatedAt || 'Just now'} | Live: ${data.live_matches}`;
        renderMatches();
      } catch (err) {
        document.getElementById('match-grid').innerHTML = `<div class="col-span-full text-center text-red-400 py-12">Failed to load stream database.</div>`;
      }
    }

    function renderMatches() {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('match-grid');
      grid.innerHTML = '';

      const filtered = matchesData.filter(m => {
        const matchesCat = currentCategory === 'ALL' || m.category === currentCategory;
        const matchesStat = currentStatus === 'ALL' || m.status === currentStatus;
        const matchesSearch = m.title.toLowerCase().includes(searchVal) || m.tournament.toLowerCase().includes(searchVal);
        return matchesCat && matchesStat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">No matches found matching your filters.</div>`;
        return;
      }

      filtered.forEach(m => {
        const isLive = m.status === 'LIVE';
        const card = document.createElement('div');
        card.className = "glass-card rounded-xl overflow-hidden hover:border-red-500/50 transition duration-300 flex flex-col justify-between";
        
        // Build playable URL parameters
        let playParams = new URLSearchParams();
        if (m.streams?.primary) playParams.append('primary', m.streams.primary);
        if (m.streams?.fancode_cdn) playParams.append('fancode_cdn', m.streams.fancode_cdn);
        if (m.streams?.fancode_np_cdn) playParams.append('fancode_np_cdn', m.streams.fancode_np_cdn);
        if (m.auto_streams?.ENGLISH?.sonu_px) playParams.append('sonu_px', m.auto_streams.ENGLISH.sonu_px);
        playParams.append('title', m.title);
        
        card.innerHTML = `
          <div class="relative">
            <img src="${m.image}" alt="${m.title}" class="w-full h-44 object-cover" loading="lazy" onerror="this.src='https://via.placeholder.com/400x225/111/fff?text=FanCode+Live'" />
            <div class="absolute top-3 left-3 bg-black/70 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-semibold text-gray-200">
              ${m.category}
            </div>
            ${isLive 
              ? `<div class="absolute top-3 right-3 bg-red-600 text-white px-2.5 py-1 rounded-full text-xs font-bold pulse-live flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-white"></span> LIVE</div>`
              : `<div class="absolute top-3 right-3 bg-gray-800/80 text-gray-300 px-2.5 py-1 rounded-full text-xs font-medium">UPCOMING</div>`
            }
          </div>
          <div class="p-4 flex-grow flex flex-col justify-between">
            <div>
              <p class="text-xs text-red-400 font-semibold mb-1 uppercase tracking-wider">${m.tournament}</p>
              <h3 class="text-sm font-bold text-white line-clamp-2 mb-2">${m.title}</h3>
            </div>
            <div>
              <p class="text-xs text-gray-400 mb-3"><i class="fa-regular fa-clock text-gray-500 mr-1"></i> ${m.startTime}</p>
              ${isLive ? `
                <a href="jwplayer.html?${playParams.toString()}" target="_self" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg text-xs flex items-center justify-center gap-2 transition">
                  <i class="fa-solid fa-play"></i> Watch Stream
                </a>
              ` : `
                <button disabled class="w-full bg-gray-800 text-gray-500 font-medium py-2 rounded-lg text-xs cursor-not-allowed">
                  Stream Unavailable
                </button>
              `}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      renderMatches();
    }
    function filterStatus(stat) {
      currentStatus = stat;
      renderMatches();
    }

    document.getElementById('search-input').addEventListener('input', renderMatches);
    fetchMatches();
  </script>
</body>
</html>
