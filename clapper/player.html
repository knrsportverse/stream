<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    
    <!-- Load the Clappr player library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        /* Classic Blue Theme */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; /* Alice Blue */
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Input Form Styles */
        #input-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #0056b3;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        #input-container h2 {
            margin-top: 0;
            color: #0056b3;
            font-size: 22px;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        input[type="text"]:focus {
            border-color: #0056b3;
            outline: none;
        }

        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #004494;
        }

        /* Player Container Styles */
        #player-wrapper {
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            display: none; /* Hidden by default */
        }
        
        .back-link {
            display: none;
            margin-bottom: 15px;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Link to go back to the input form (Hidden by default) -->
    <a href="?" id="back-link" class="back-link">← Load another stream</a>

    <!-- The Input Field Interface -->
    <div id="input-container">
        <h2>Load Media Stream</h2>
        <input type="text" id="stream-url" placeholder="Paste your stream link here..." autocomplete="off" />
        <br>
        <button id="play-btn">Play Stream</button>
    </div>

    <!-- The Clappr Player Container -->
    <div id="player-wrapper"></div>

    <script>
        // Check the URL for the '?q=' parameter
        const urlParams = new URLSearchParams(window.location.search);
        const base64Query = urlParams.get('q');

        const inputContainer = document.getElementById('input-container');
        const playerWrapper = document.getElementById('player-wrapper');
        const backLink = document.getElementById('back-link');
        const playBtn = document.getElementById('play-btn');
        const urlInput = document.getElementById('stream-url');

        if (base64Query) {
            // We have a Base64 string in the URL. Let's play it!
            try {
                // Decode the Base64 string back into a normal URL
                const decodedUrl = atob(base64Query);

                // Hide the input form, show the player and back link
                inputContainer.style.display = 'none';
                playerWrapper.style.display = 'block';
                backLink.style.display = 'block';
                
                // Change background to black for better viewing
                document.body.style.backgroundColor = '#111';

                // Initialize Clappr Player exactly as requested
                var player = new Clappr.Player({
                    source: decodedUrl,
                    mimeType: "application/x-mpegURL", // CRITICAL for ?token links
                    parentId: "#player-wrapper",
                    autoPlay: true, // Set to true so it plays immediately upon redirect
                    width: '100%',
                    height: '450px'
                });

            } catch (error) {
                // If someone tampers with the ?q= value and it's not valid Base64
                alert("Invalid encoded URL provided.");
                window.location.href = "?"; // Redirect to clean page
            }
        } else {
            // No '?q=' parameter. Handle the button click to encode the URL and redirect.
            playBtn.addEventListener('click', function() {
                const rawUrl = urlInput.value.trim();
                
                if (rawUrl) {
                    // Encode the URL to Base64
                    const encodedUrl = btoa(rawUrl);
                    // Redirect the same tab to the new URL
                    window.location.href = "?q=" + encodedUrl;
                } else {
                    alert("Please enter a valid link.");
                }
            });

            // Allow pressing "Enter" on the keyboard to trigger the button
            urlInput.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    playBtn.click();
                }
            });
        }
    </script>

</body>
</html>
