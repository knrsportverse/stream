<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents unwanted zooming on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KNR SPORTVERSE - STREAM</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231D4ED8'/><stop offset='100%' stop-color='%2360A5FA'/></linearGradient></defs><rect x='4' y='4' width='52' height='52' rx='12' fill='url(%23grad)' stroke='white' stroke-width='1.5'/><text x='30' y='38' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='700' fill='white'>KNR</text></svg>">
    <!-- Load the Clappr player library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        /* Base Body Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; /* Classic Blue Theme */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
        }

        /* Body state when streaming */
        body.streaming {
            background-color: #000;
            overflow: hidden; /* Locks the screen from scrolling */
        }

        /* --- 1. MOBILE FRIENDLY INPUT SECTION --- */
        #input-section {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        #input-container {
            background-color: #ffffff;
            padding: 40px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #0056b3;
            text-align: center;
            width: 100%;
            max-width: 450px; /* Keeps it from getting too wide on desktop */
            box-sizing: border-box;
        }

        #input-container h2 {
            margin-top: 0;
            color: #0056b3;
            font-size: 24px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px; /* 16px prevents iOS from auto-zooming on focus */
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #0056b3;
            outline: none;
        }

        button#play-btn {
            width: 100%;
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#play-btn:hover {
            background-color: #004494;
        }

        /* --- 2 & 3. STREAM PAGE & PLAYER WRAPPER --- */
        #stream-section {
            display: none; /* Hidden until valid link */
            width: 100vw;
            height: 100vh;
            position: relative;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #player-wrapper {
            /* Touches edges perfectly without "auto" */
            width: 100%;
            height: 100%;
        }

        /* --- 4. GLASS UNMUTE BUTTON --- */
        #unmute-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 9999; /* Stays above the player */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); /* Glass blur effect */
            -webkit-backdrop-filter: blur(12px); /* Safari support */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px; /* Pill shape */
            padding: 12px 20px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, transform 0.2s ease;
        }

        #unmute-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        #unmute-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Link Entering Section -->
    <div id="input-section">
        <div id="input-container">
            <h2>Live Stream Player</h2>
            <input type="text" id="stream-url" placeholder="Paste your ?token= link here..." autocomplete="off" />
            <button id="play-btn">Play Stream</button>
        </div>
    </div>

    <!-- Stream Page Section (No back buttons) -->
    <div id="stream-section">
        
        <!-- Glass Effect Unmute Button -->
        <button id="unmute-btn">
            <!-- Muted Speaker SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            Click to Unmute
        </button>

        <div id="player-wrapper"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const base64Query = urlParams.get('q');

        const inputSection = document.getElementById('input-section');
        const streamSection = document.getElementById('stream-section');
        const playBtn = document.getElementById('play-btn');
        const urlInput = document.getElementById('stream-url');
        const unmuteBtn = document.getElementById('unmute-btn');

        if (base64Query) {
            try {
                // Decode the link
                const decodedUrl = atob(base64Query);

                // Hide input, display player section, change body to pure black
                inputSection.style.display = 'none';
                streamSection.style.display = 'flex';
                document.body.classList.add('streaming'); 

                // Initialize Clappr Player
                var player = new Clappr.Player({
                    source: decodedUrl,
                    mimeType: "application/x-mpegURL", 
                    parentId: "#player-wrapper",
                    
                    autoPlay: true, 
                    mute: true, // MUST start muted for browsers to allow Autoplay
                    
                    // Fixed 100% values so it stretches to touch the edges (no "auto")
                    width: '100%',
                    height: '100%',
                });

                // Unmute button logic
                unmuteBtn.addEventListener('click', function() {
                    // Tell Clappr to set volume to 100% (which automatically unmutes it)
                    player.setVolume(100);
                    
                    // Bulletproof fallback: manually unmute the HTML5 video tag directly
                    const videoTag = document.querySelector('#player-wrapper video');
                    if (videoTag) {
                        videoTag.muted = false;
                        videoTag.volume = 1.0;
                    }

                    // Hide the button forever
                    this.style.display = 'none';
                });

            } catch (error) {
                alert("Invalid encoded URL. Redirecting back.");
                window.location.href = "?"; 
            }
        } else {
            // Encode link logic
            playBtn.addEventListener('click', function() {
                const rawUrl = urlInput.value.trim();
                if (rawUrl) {
                    const encodedUrl = btoa(rawUrl);
                    window.location.href = "?q=" + encodedUrl;
                } else {
                    alert("Please enter a valid link.");
                }
            });

            // Enter key trigger
            urlInput.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    playBtn.click();
                }
            });
        }
    </script>

</body>
</html>
