<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KNR SPORTVERSE - STREAM</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231D4ED8'/><stop offset='100%' stop-color='%2360A5FA'/></linearGradient></defs><rect x='4' y='4' width='52' height='52' rx='12' fill='url(%23grad)' stroke='white' stroke-width='1.5'/><text x='30' y='38' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='700' fill='white'>KNR</text></svg>">
    
    <!-- Load Clappr -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        /* Base styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
        }

        body.streaming {
            background-color: #000;
            overflow: hidden; 
        }

        /* Input UI */
        #input-section {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        #input-container {
            background-color: #ffffff;
            padding: 40px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #0056b3;
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        #input-container h2 {
            margin-top: 0;
            color: #0056b3;
            font-size: 24px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px; 
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #0056b3;
            outline: none;
        }

        button#play-btn {
            width: 100%;
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button#play-btn:hover {
            background-color: #004494;
        }

        /* Stream UI */
        #stream-section {
            display: none; 
            width: 100vw;
            height: 100vh;
            position: relative;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #player-wrapper {
            width: 100%;
            height: 100%;
        }

        /*Player Loading Customization*/
        .spinner-three-bounce[data-spinner] > div {
    background-color: #1e88e5 !important; 
        }
    </style>
</head>
<body>

    <!-- Link Entry -->
    <div id="input-section">
        <div id="input-container">
            <h2>Live Stream Player</h2>
            <input type="text" id="stream-url" placeholder="Paste your ?token= link here..." autocomplete="off" />
            <button id="play-btn">Play Stream</button>
        </div>
    </div>

    <!-- Video Player -->
    <div id="stream-section">
        <div id="player-wrapper"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const base64Query = urlParams.get('q');

        const inputSection = document.getElementById('input-section');
        const streamSection = document.getElementById('stream-section');
        const playBtn = document.getElementById('play-btn');
        const urlInput = document.getElementById('stream-url');

        if (base64Query) {
            try {
                const decodedUrl = atob(base64Query);

                inputSection.style.display = 'none';
                streamSection.style.display = 'flex';
                document.body.classList.add('streaming'); 

                // Setup Clappr Player
                var player = new Clappr.Player({
    source: decodedUrl,
    mimeType: "application/x-mpegURL", 
    parentId: "#player-wrapper",
    autoPlay: false, 
    mute: false,     
    width: '100%',
    height: '100%',
    
    // Player Customization
    mediacontrol: {
        seekbar: "#1e88e5",
        buttons: "#1e88e5"
    }
});


            } catch (error) {
                alert("Invalid encoded URL. Redirecting back.");
                window.location.href = "?"; 
            }
        } else {
            playBtn.addEventListener('click', function() {
                const rawUrl = urlInput.value.trim();
                if (rawUrl) {
                    const encodedUrl = btoa(rawUrl);
                    window.location.href = "?q=" + encodedUrl;
                } else {
                    alert("Please enter a valid link.");
                }
            });

            urlInput.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    playBtn.click();
                }
            });
        }
    </script>

</body>
</html>
