<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeraStreams - SonyLiv Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Header Banner -->
        <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-8 gap-4 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
            
            <div class="relative z-10">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight" id="page-title">SonyLiv Live Streams</h1>
                <p class="text-slate-400 text-sm mt-2 flex items-center gap-2 font-medium">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span id="last-update">Syncing latest streams...</span>
                </p>
            </div>
            
            <div class="flex gap-4 relative z-10">
                <div class="bg-slate-900/80 backdrop-blur-sm px-5 py-3 rounded-xl border border-slate-700 text-center min-w-[100px] shadow-inner">
                    <span class="block text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Live</span>
                    <span class="block text-2xl font-black text-rose-500 drop-shadow-[0_0_8px_rgba(244,63,94,0.5)]" id="live-count">0</span>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="flex flex-col justify-center items-center h-64 text-slate-400">
            <svg class="animate-spin h-12 w-12 mb-4 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="font-medium tracking-wide">Loading streams...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden text-center text-rose-400 py-12 bg-rose-950/30 rounded-2xl border border-rose-900/50 backdrop-blur-sm">
            <svg class="w-12 h-12 mx-auto mb-3 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-lg font-semibold">Unable to fetch event data.</p>
            <p class="text-sm mt-1 text-rose-300/70">Please check your connection and try again later.</p>
        </div>

        <!-- Cards Grid -->
        <div id="matches-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
            <!-- Cards injected via JavaScript -->
        </div>
    </main>

    <!-- PLAYER POPUP MODAL -->
    <div id="stream-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-2 sm:p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
            
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 border-b border-slate-800 flex justify-between items-center gap-4 bg-slate-900/80">
                <div class="flex items-center gap-3">
                    <div id="modal-status-badge"></div>
                    <div>
                        <h3 id="modal-title" class="text-base sm:text-lg font-bold text-white leading-snug"></h3>
                        <p id="modal-tournament" class="text-xs text-emerald-400 font-medium mt-0.5 flex items-center gap-1">
                            <span id="modal-tournament-text"></span>
                        </p>
                    </div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-2 rounded-xl transition-colors shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Content (Player + Stream Selector) -->
            <div class="flex flex-col lg:flex-row flex-grow overflow-hidden">
                
                <!-- Embedded Player Frame Container -->
                <div class="w-full lg:w-3/4 bg-black relative flex items-center justify-center min-h-[300px] sm:min-h-[420px] lg:min-h-[500px]">
                    <iframe id="player-iframe" class="w-full h-full border-0 absolute inset-0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>

                <!-- Stream Selection Sidebar -->
                <div class="w-full lg:w-1/4 bg-slate-900/90 border-t lg:border-t-0 lg:border-l border-slate-800 p-4 flex flex-col gap-4 overflow-y-auto max-h-[250px] lg:max-h-none">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-400">Available Audios / Streams</div>
                    <div id="stream-buttons-container" class="flex flex-col gap-2.5">
                        <!-- Stream selection buttons injected dynamically -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Corrected API URL pointing to the user's raw GitHub playlist file
        const API_URL = "https://raw.githubusercontent.com/srhady/SonyLiv/refs/heads/main/sonyliv_playlist.json";
        
        // Clappr Player Base URL
        const PLAYER_BASE_URL = "https://knrstream.pages.dev/clappr/player";
        
        let globalMatches = [];
        let currentActiveButton = null;

        async function init() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                globalMatches = data.live_matches || [];
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('matches-grid').classList.remove('hidden');

                renderHeader(data.playlist_info, globalMatches.length);
                renderMatches(globalMatches);

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function renderHeader(playlistInfo, count) {
            if (playlistInfo && playlistInfo.last_update) {
                document.getElementById('last-update').innerHTML = `Last Update: <span class="text-slate-300">${playlistInfo.last_update}</span>`;
            }
            document.getElementById('live-count').textContent = count || 0;
        }

        function renderMatches(matches) {
            const grid = document.getElementById('matches-grid');
            if (!matches || matches.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-400 py-12 bg-slate-800 rounded-xl border border-slate-700">No live streams currently available.</div>';
                return;
            }

            matches.forEach((match, index) => {
                const card = document.createElement('div');
                card.className = 'bg-slate-800 rounded-2xl overflow-hidden shadow-lg border border-slate-700 flex flex-col fade-in-up group hover:border-slate-500 cursor-pointer transition-all duration-300 hover:shadow-2xl hover:-translate-y-1';
                card.style.animationDelay = `${index * 0.04}s`;
                card.onclick = () => openModal(index);

                const statusBadge = `
                    <span class="bg-rose-500 text-white text-xs font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-[0_0_12px_rgba(244,63,94,0.6)] animate-pulse border border-rose-400 flex items-center gap-1.5 backdrop-blur-md">
                        <span class="w-1.5 h-1.5 bg-white rounded-full"></span> LIVE
                    </span>`;

                const imageUrl = match.thumbnail || 'https://placehold.co/600x400/1e293b/94a3b8?text=Match+Thumb';

                card.innerHTML = `
                    <div class="relative h-48 w-full bg-slate-900 overflow-hidden">
                        <img src="${imageUrl}" alt="Event Cover" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-in-out" onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Image+Unavailable'">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
                        <div class="absolute top-3 left-3 z-10">
                            ${statusBadge}
                        </div>
                    </div>
                    
                    <div class="p-5 flex flex-col flex-grow relative z-10">
                        <h2 class="text-[1.05rem] font-bold text-slate-100 line-clamp-2 leading-snug mb-3 group-hover:text-emerald-400 transition-colors" title="${match.title}">${match.title}</h2>
                        
                        <div class="text-sm font-medium text-slate-300 mb-4 flex-grow flex flex-col gap-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                            <div class="flex items-center gap-2">
                                <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                <span class="truncate">${match.tournament || 'SonyLiv Special'}</span>
                            </div>
                        </div>

                        <div class="w-full bg-emerald-600/20 group-hover:bg-emerald-600 text-emerald-400 group-hover:text-white border border-emerald-500/30 font-semibold py-2.5 px-4 rounded-xl transition-all duration-200 text-xs flex justify-center items-center gap-2 shadow-md">
                            <span>Watch Stream</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(index) {
            const match = globalMatches[index];
            if (!match) return;

            const modal = document.getElementById('stream-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalTournament = document.getElementById('modal-tournament-text');
            const modalBadge = document.getElementById('modal-status-badge');
            const streamButtonsContainer = document.getElementById('stream-buttons-container');
            const iframe = document.getElementById('player-iframe');

            modalTitle.textContent = match.title;
            modalTournament.textContent = match.tournament || '';

            modalBadge.innerHTML = `<span class="bg-rose-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full uppercase tracking-widest border border-rose-400">LIVE</span>`;

            let buttonsHtml = '';
            const baseUrls = match.base_urls || {};
            const token = match.token || '';
            const audioList = match.audio_list || [];

            const getLangLabel = (code) => {
                const found = audioList.find(a => a.lang_code === code);
                return found ? found.lang_label : code;
            };

            for (const [langCode, baseUrl] of Object.entries(baseUrls)) {
                if (baseUrl) {
                    const fullStreamUrl = baseUrl + token;
                    const langLabel = getLangLabel(langCode);

                    buttonsHtml += `
                        <button onclick="playStream('${encodeURIComponent(fullStreamUrl)}', this)" 
                            class="stream-btn w-full text-left bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3.5 py-3 rounded-xl border border-slate-700/80 transition-all flex items-center justify-between group">
                            <span class="truncate">Stream (${langLabel})</span>
                            <svg class="w-4 h-4 text-emerald-400 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </button>`;
                }
            }

            if (!buttonsHtml) {
                streamButtonsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No streams available.</p>`;
                iframe.src = '';
            } else {
                streamButtonsContainer.innerHTML = buttonsHtml;
                const firstBtn = streamButtonsContainer.querySelector('button');
                if (firstBtn) {
                    firstBtn.click();
                }
            }

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function playStream(encodedUrl, buttonElement) {
            const iframe = document.getElementById('player-iframe');
            const streamUrl = decodeURIComponent(encodedUrl);

            // Encode stream link to Base64 for Clappr player format
            const b64Url = btoa(streamUrl);
            const playerTarget = `${PLAYER_BASE_URL}?q=${b64Url}`;

            iframe.src = playerTarget;

            if (currentActiveButton) {
                currentActiveButton.classList.remove('bg-emerald-600/30', 'border-emerald-500', 'text-white');
                currentActiveButton.classList.add('bg-slate-800', 'border-slate-700/80', 'text-slate-200');
            }
            buttonElement.classList.remove('bg-slate-800', 'border-slate-700/80', 'text-slate-200');
            buttonElement.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-white');
            currentActiveButton = buttonElement;
        }

        function closeModal() {
            const modal = document.getElementById('stream-modal');
            const iframe = document.getElementById('player-iframe');
            iframe.src = ''; 
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            currentActiveButton = null;
        }

        document.getElementById('stream-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
