<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNR SPORTVERSE - STREAM</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231D4ED8'/><stop offset='100%' stop-color='%2360A5FA'/></linearGradient></defs><rect x='4' y='4' width='52' height='52' rx='12' fill='url(%23grad)' stroke='white' stroke-width='1.5'/><text x='30' y='38' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='700' fill='white'>KNR</text></svg>">

    <!-- Load Shaka Player UI components (v4.16.3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/controls.css">

    <!-- Load Material Icons for Shaka UI -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Plus Jakarta Sans for the Unmute Button -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }

        /* HIDE DEFAULT SPINNERS */
        .shaka-spinner-container,
        .shaka-spinner,
        .shaka-spinner-svg {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* ERROR BADGE */
        .error-badge {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            z-index: 500;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
            display: none;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .error-badge.show {
            display: block;
        }

        /* WATERMARK */
        .watermark {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 1000;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        /* CUSTOM CONTROLS & BLUE THEME OVERRIDES */
        .shaka-controls-container {
            z-index: 10 !important;
        }

        .shaka-play-button {
            z-index: 15 !important;
        }

        /* Timeline Scrubber / Progress Bar Accent */
        input.shaka-range-element::-webkit-slider-thumb {
            background: #00c6ff !important;
        }
        input.shaka-range-element::-moz-range-thumb {
            background: #00c6ff !important;
        }
        
        .shaka-range-element {
            accent-color: #00c6ff !important;
        }

        /* PREMIUM BLUE SETTINGS MENU STYLES */
        .shaka-settings-menu {
            background: rgba(8, 12, 28, 0.85) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.25);
            padding: 8px 10px;
            border: 1px solid rgba(0, 198, 255, 0.25);
            max-width: 220px;
            animation: fadeIn 0.25s ease;
        }

        .shaka-settings-menu button {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border-radius: 8px;
            padding: 6px 12px;
            margin: 4px 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 13px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .shaka-settings-menu button::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.15), rgba(0, 114, 255, 0.15));
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 8px;
            z-index: 0;
        }

        .shaka-settings-menu button:hover::before,
        .shaka-settings-menu button:focus::before {
            opacity: 1;
        }

        .shaka-settings-menu button:hover,
        .shaka-settings-menu button:focus {
            border-color: #00c6ff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
            color: #fff;
        }

        .shaka-settings-menu button[aria-checked="true"] {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 12px rgba(0, 198, 255, 0.7);
        }

        .shaka-settings-menu button:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        /* ============ UNMUTE BUTTON ============ */
        #unmuteBtn {
            display: flex;
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 30;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 9999px;
            background: rgba(8, 12, 28, 0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.13);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: opacity 0.38s ease, transform 0.38s ease, background 0.18s ease;
            animation: unmutePulse 2.6s ease-in-out infinite;
        }

        #unmuteBtn:hover {
            background: rgba(18, 24, 48, 0.92);
        }

        #unmuteBtn:active {
            transform: scale(0.95);
        }

        #unmuteBtn.fade-out {
            opacity: 0 !important;
            transform: translateY(-10px) scale(0.84) !important;
            pointer-events: none;
            animation: none !important;
        }

        @keyframes unmutePulse {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.13);
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.50);
            }
            50% {
                border-color: rgba(0, 198, 255, 0.45);
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.50), 0 0 0 3px rgba(0, 198, 255, 0.20);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>
    <div id="video-container">
        <video id="video" class="shaka-video" autoplay muted playsinline preload="metadata"></video>
        
        <!-- UNMUTE BUTTON -->
        <button id="unmuteBtn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"
                 style="width:15px;height:15px;flex-shrink:0;color:#00c6ff;">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2
                         1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86
                         5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25
                         1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12
                         4L9.91 6.09 12 8.18V4z"/>
            </svg>
            <span>Click to Unmute</span>
        </button>

        <div class="watermark">WEBSITE: KNR SPORTVERSE</div>
        <div class="error-badge" id="errorBadge"></div>

        <!-- Shaka UI Control Container Wrapper -->
        <div class="shaka-controls-container" shaka-controls></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Install polyfills early
            shaka.polyfill.installAll();

            const errorBadge = document.getElementById('errorBadge');
            const unmuteBtn = document.getElementById('unmuteBtn');
            let firstUnmuteOccurred = false;
            let errorTimeout = null;

            // 1. Parse URL parameters
            const params = new URLSearchParams(window.location.search);
            const manifestUri = params.get('manifest') || params.get('q');
            const keyHex = params.get('key');
            const keyIdHex = params.get('keyid');
            const thumbUri = params.get('thumb');

            if (!manifestUri) {
                showError('No manifest/stream URI provided. Use ?manifest=URL');
                return;
            }

            // 2. Get DOM elements
            const video = document.getElementById('video');
            const container = document.getElementById('video-container');

            if (thumbUri) {
                video.poster = thumbUri;
            }

            // 3. Initialize Player and UI
            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, container, video);

            // 4. Configure UI Controls
            ui.configure({
                controlPanelElements: [
                    'play_pause', 'time_and_duration',
                    'spacer', 'mute', 'fit_mode', 'volume', 'captions', 'picture_in_picture', 'quality', 'playback_rate',
                    'cast', 'fullscreen'
                ],
                enableQualitySelection: true,
                addBigPlayButton: true
            });

            // 5. Error Handling
            player.addEventListener('error', (e) => {
                console.error('Shaka Player Error:', e.detail);
                showError(e.detail.message || 'Failed to load stream');
            });

            // 6. Handle DRM Configuration (ClearKey)
            if (keyIdHex && keyHex) {
                try {
                    const clearKeyMap = {};
                    clearKeyMap[keyIdHex] = keyHex;

                    player.configure({
                        drm: {
                            clearKeys: clearKeyMap,
                            servers: {
                                'org.w3.clearkey': manifestUri
                            }
                        }
                    });
                    console.log('ClearKey configuration applied successfully.');
                } catch (e) {
                    console.error('ClearKey setup failed:', e);
                }
            }

            // 7. Load the stream manifest
            try {
                await player.load(manifestUri);
                console.log('Video loaded successfully:', manifestUri);
            } catch (e) {
                console.error('Error loading video manifest', e);
                showError('Failed to parse stream manifest');
            }

            // 8. Handle Autoplay / Mute Logic
            video.muted = true;
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => console.log("Autoplay blocked:", err));
            }

            unmuteBtn.addEventListener('click', handleUnmute);

            function handleUnmute() {
                if (!firstUnmuteOccurred) {
                    video.muted = false;
                    video.volume = 1;
                    firstUnmuteOccurred = true;
                    unmuteBtn.classList.add('fade-out');
                }
            }

            function showError(message) {
                if (errorTimeout) clearTimeout(errorTimeout);
                errorBadge.textContent = `KNR SPORTVERSE: ${message}`;
                errorBadge.classList.add('show');
                errorTimeout = setTimeout(() => {
                    errorBadge.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>

</html>
