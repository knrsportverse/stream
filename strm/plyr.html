<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNR SPORTVERSE - STREAM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231D4ED8'/><stop offset='100%' stop-color='%2360A5FA'/></linearGradient></defs><rect x='4' y='4' width='52' height='52' rx='12' fill='url(%23grad)' stroke='white' stroke-width='1.5'/><text x='30' y='38' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='700' fill='white'>KNR</text></svg>">
  
  <!-- Bitmovin Player -->
  <script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" crossorigin="anonymous">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #player-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .error-badge {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      text-align: center;
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
      display: none;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .error-badge.show {
      display: block;
    }

    .watermark {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 1000;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .unmute-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .unmute-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 35px rgba(255, 255, 255, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .unmute-btn:active {
      transform: translateY(0);
    }

    .unmute-btn.hidden {
      display: none;
    }

    .unmute-btn i {
      font-size: 16px;
    }

    @media (max-width: 480px) {
      .unmute-btn {
        top: 10px;
        left: 10px;
        padding: 10px 18px;
        font-size: 13px;
        gap: 8px;
        border-radius: 50px;
      }
      .unmute-btn i { font-size: 14px; }
      .error-badge {
        top: 10px;
        padding: 10px 16px;
        font-size: 12px;
        border-radius: 50px;
      }
    }
  </style>
</head>

<body>
  <div id="player-container"></div>
  
  <button class="unmute-btn" id="unmuteBtn" title="Click to Unmute">
    <i class="fas fa-volume-mute"></i>
    <span>Click to Unmute</span>
  </button>
  
  <div class="watermark">WEBSITE: KNR SPORTVERSE</div>
  
  <div class="error-badge" id="errorBadge"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBII2OvFCMb2ZbtrUj_2DrhexUcU3TxSS0",
      authDomain: "knrstream-47104.firebaseapp.com",
      projectId: "knrstream-47104",
      storageBucket: "knrstream-47104.firebasestorage.app",
      messagingSenderId: "390036335226",
      appId: "1:390036335226:web:38584b0002f224021369c3",
      measurementId: "G-QD8RDB9CGC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const errorBadge = document.getElementById('errorBadge');
    const unmuteBtn = document.getElementById('unmuteBtn');
    let firstUnmuteOccurred = false;
    let errorTimeout = null;
    let playerInstance = null;

    const params = new URLSearchParams(window.location.search);
    const streamId = params.get('q');

    if (!streamId) {
      showError('No stream ID provided. Use ?q=stream_id');
      throw new Error('No stream ID');
    }

    async function loadStream() {
      try {
        const q = query(collection(db, 'streams'), where('stream_id', '==', streamId));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          showError(`Stream "${streamId}" not found`);
          return;
        }

        const streamData = querySnapshot.docs[0].data();
        const mpd_url = streamData.mpd_url;
        const drm_keys = streamData.drm_keys; // Assumed object: { 'kid': 'key' }

        // Convert DRM keys to Bitmovin format
        const bitmovinClearKeys = [];
        if (drm_keys) {
          for (const [kid, key] of Object.entries(drm_keys)) {
            bitmovinClearKeys.push({ kid: kid, key: key });
          }
        }

        const container = document.getElementById('player-container');
        
        // Bitmovin Player Configuration
        const config = {
          key: 'YOUR_BITMOVIN_LICENSE_KEY', // <-- REPLACE WITH YOUR BITMOVIN KEY
          playback: {
            autoplay: true,
            muted: true
          },
          tweaks: {
            max_buffer_level: 15,
            startup_threshold: 2
          }
        };

        playerInstance = new bitmovin.player.Player(container, config);

        playerInstance.on(bitmovin.player.PlayerEvent.Error, (event) => {
          console.error('Bitmovin Player Error:', event);
          showError(event.message || 'Failed to load stream');
        });

        // Source Configuration
        const sourceConfig = {
          dash: mpd_url,
          drm: {
            clearkey: bitmovinClearKeys
          }
        };

        await playerInstance.load(sourceConfig);
        unmuteBtn.addEventListener('click', handleUnmute);

      } catch (error) {
        console.error('Error:', error);
        showError(error.message);
      }
    }

    function handleUnmute() {
      if (!firstUnmuteOccurred && playerInstance) {
        playerInstance.unmute();
        playerInstance.setVolume(100);
        firstUnmuteOccurred = true;
        unmuteBtn.classList.add('hidden');
      }
    }

    function showError(message) {
      if (errorTimeout) {
        clearTimeout(errorTimeout);
      }
      
      errorBadge.textContent = `KNR SPORTVERSE: ${message}`;
      errorBadge.classList.add('show');
      
      errorTimeout = setTimeout(() => {
        errorBadge.classList.remove('show');
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', loadStream);
  </script>
</body>
</html>
