<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNR SPORTVERSE - STREAM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231D4ED8'/><stop offset='100%' stop-color='%2360A5FA'/></linearGradient></defs><rect x='4' y='4' width='52' height='52' rx='12' fill='url(%23grad)' stroke='white' stroke-width='1.5'/><text x='30' y='38' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='700' fill='white'>KNR</text></svg>">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" crossorigin="anonymous">
  
  <!-- Added Plus Jakarta Sans font for the Unmute Button -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    .error-badge {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      text-align: center;
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
      display: none;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .error-badge.show {
      display: block;
    }

    .watermark {
      position: absolute;
      top: 24px;
      right: 24px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      z-index: 1000;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }

    /* ============ UNMUTE BUTTON ============ */
    #unmuteBtn {
        display: flex;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 30;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.38s ease, transform 0.38s ease, background 0.2s ease, border-color 0.2s ease;
        animation: unmutePulse 2.6s ease-in-out infinite;
    }

    #unmuteBtn:hover {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(96, 165, 250, 0.6);
    }

    #unmuteBtn:active {
        transform: scale(0.95);
    }

    #unmuteBtn.fade-out {
        opacity: 0 !important;
        transform: translateY(-10px) scale(0.84) !important;
        pointer-events: none;
        animation: none !important;
    }

    @keyframes unmutePulse {
        0%, 100% {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.50);
        }
        50% {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.50), 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
    }


    /* ========================================================
       SHAKA PLAYER MODERN UI OVERRIDES 
       (Only presentation, styling, CSS properties modified)
       ======================================================== */
    
    :root {
      --primary-blue: #3b82f6;
      --primary-blue-hover: #60a5fa;
      --menu-bg: rgba(15, 23, 42, 0.85);
      --controls-gradient: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 40%, transparent 100%);
    }

    /* CSS Variables Mapping */
    .shaka-video-container {
      --shaka-theme-color: var(--primary-blue) !important;
      --shaka-play-color: var(--primary-blue) !important;
      --shaka-volume-bar-color: var(--primary-blue) !important;
      --shaka-buffer-history-color: rgba(255, 255, 255, 0.25) !important;
      --shaka-text-color: #f8fafc !important;
    }

    /* Global Focus State */
    .shaka-video-container *:focus-visible {
      outline: 2px solid var(--primary-blue-hover) !important;
      outline-offset: 2px !important;
      border-radius: inherit;
    }

    /* Bottom Control Bar Container */
    .shaka-bottom-controls {
      background: var(--controls-gradient) !important;
      padding: 16px 24px 24px 24px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-end !important;
      border-radius: 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Seek/Progress Bar */
    .shaka-seek-bar-container {
      margin: 0 0 16px 0 !important;
      height: 5px !important;
      border-radius: 4px !important;
      transition: height 0.2s ease, transform 0.2s ease !important;
      background: rgba(255, 255, 255, 0.15) !important;
    }
    .shaka-seek-bar-container:hover {
      height: 8px !important;
      cursor: pointer !important;
    }
    .shaka-seek-history {
      border-radius: 4px !important;
    }

    /* Button Panel */
    .shaka-controls-button-panel {
      padding: 0 !important;
      align-items: center !important;
      height: auto !important;
    }
    
    /* Individual Buttons (Mute, Fullscreen, Quality, PIP, etc.) */
    .shaka-controls-button-panel > * {
      margin: 0 6px !important;
      color: #cbd5e1 !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
      background: transparent !important;
      height: 38px !important;
      width: 38px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .shaka-controls-button-panel > *:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      color: var(--primary-blue-hover) !important;
      transform: translateY(-2px) !important;
    }
    /* Ensure SVG icons color match the button */
    .shaka-controls-button-panel > * svg,
    .shaka-controls-button-panel > * i {
      fill: currentColor !important;
      color: currentColor !important;
      transition: fill 0.2s ease !important;
    }

    /* Center Big Play/Pause Button */
    .shaka-play-button-container {
      /* Maintains default centering logic */
    }
    .shaka-play-button {
      background-color: rgba(59, 130, 246, 0.85) !important; /* Blue background */
      border-radius: 50% !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3) !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      padding: 16px !important;
      width: 76px !important;
      height: 76px !important;
    }
    .shaka-play-button:hover {
      background-color: var(--primary-blue) !important;
      transform: scale(1.1) !important;
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5) !important;
    }
    .shaka-play-button svg, 
    .shaka-play-button i {
      width: 38px !important;
      height: 38px !important;
      fill: #ffffff !important;
      color: #ffffff !important;
    }

    /* Time Display */
    .shaka-current-time, .shaka-duration, .shaka-time-and-duration {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
      font-weight: 600 !important;
      color: #e2e8f0 !important;
      font-size: 14px !important;
      margin: 0 16px !important;
      letter-spacing: 0.02em !important;
      width: auto !important;
    }

    /* Volume Slider styling */
    .shaka-volume-bar-container {
      background: rgba(255, 255, 255, 0.15) !important;
      height: 5px !important;
      border-radius: 4px !important;
    }
    .shaka-volume-bar-container:hover {
      height: 6px !important;
    }

    /* Settings & Overflow Menus */
    .shaka-settings-menu, .shaka-overflow-menu {
      background: var(--menu-bg) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 14px !important;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05) !important;
      padding: 8px !important;
      min-width: 220px !important;
    }
    
    /* Menu Items */
    .shaka-settings-menu button, .shaka-overflow-menu button {
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
      font-weight: 500 !important;
      font-size: 14px !important;
      padding: 10px 16px !important;
      color: #e2e8f0 !important;
      margin-bottom: 4px !important;
      display: flex !important;
      align-items: center !important;
    }
    .shaka-settings-menu button:hover, .shaka-overflow-menu button:hover {
      background: rgba(59, 130, 246, 0.15) !important;
      color: var(--primary-blue-hover) !important;
    }
    .shaka-settings-menu button:active, .shaka-overflow-menu button:active {
      transform: scale(0.98) !important;
    }

    /* Active / Selected Menu Items */
    .shaka-settings-menu button[aria-selected="true"],
    .shaka-settings-menu button[aria-selected="true"] i,
    .shaka-settings-menu button[aria-selected="true"] span {
       color: var(--primary-blue-hover) !important;
    }

    /* Menu Headings (e.g. Back button in submenus) */
    .shaka-back-to-overflow-button {
      border-bottom: 1px solid rgba(255,255,255,0.08) !important;
      border-radius: 8px 8px 0 0 !important;
      margin-bottom: 8px !important;
      padding-bottom: 12px !important;
      font-weight: 700 !important;
      color: #ffffff !important;
    }
    .shaka-back-to-overflow-button:hover {
      background: rgba(255,255,255,0.05) !important;
    }

    /* Small "Auto" text span */
    .shaka-auto-span {
       color: #94a3b8 !important; 
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .shaka-bottom-controls {
        padding: 12px 16px 20px 16px !important;
      }
      .shaka-controls-button-panel > * {
        width: 34px !important;
        height: 34px !important;
        margin: 0 4px !important;
      }
      .shaka-time-and-duration {
        font-size: 12px !important;
        margin: 0 8px !important;
      }
      .shaka-play-button {
        width: 64px !important;
        height: 64px !important;
        padding: 14px !important;
      }
      .watermark {
        top: 16px;
        right: 16px;
        font-size: 9px;
      }
    }

    @media (max-width: 480px) {
      .error-badge {
        top: 10px;
        padding: 10px 16px;
        font-size: 12px;
      }
      .shaka-bottom-controls {
        padding: 10px 12px 16px 12px !important;
      }
      .shaka-controls-button-panel > * {
        margin: 0 2px !important;
      }
      .shaka-time-and-duration {
        display: none !important; /* Sometimes too crowded on tiny screens, but Shaka natively handles this well. Leaving to flex if room permits */
      }
      #unmuteBtn {
        top: 12px;
        left: 12px;
        padding: 8px 16px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="shaka-video-container" data-shaka-player>
    <video autoplay muted playsinline preload="metadata" poster=""></video>
    
    <!-- ═══ UNMUTE BUTTON ═══ -->
    <button id="unmuteBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"
             style="width:15px;height:15px;flex-shrink:0;color:#60a5fa;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2
                     1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86
                     5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25
                     1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12
                     4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <span>Click to Unmute</span>
    </button>
    
    <div class="watermark">WEBSITE: KNR SPORTVERSE</div>
    
    <div class="error-badge" id="errorBadge"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBII2OvFCMb2ZbtrUj_2DrhexUcU3TxSS0",
      authDomain: "knrstream-47104.firebaseapp.com",
      projectId: "knrstream-47104",
      storageBucket: "knrstream-47104.firebasestorage.app",
      messagingSenderId: "390036335226",
      appId: "1:390036335226:web:38584b0002f224021369c3",
      measurementId: "G-QD8RDB9CGC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const errorBadge = document.getElementById('errorBadge');
    const unmuteBtn = document.getElementById('unmuteBtn');
    let firstUnmuteOccurred = false;
    let errorTimeout = null;

    const params = new URLSearchParams(window.location.search);
    const streamId = params.get('q');

    if (!streamId) {
      showError('No stream ID provided. Use ?q=stream_id');
      throw new Error('No stream ID');
    }

    async function loadStream() {
      try {
        const q = query(collection(db, 'streams'), where('stream_id', '==', streamId));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          showError(`Stream "${streamId}" not found`);
          return;
        }

        const streamData = querySnapshot.docs[0].data();
        const mpd_url = streamData.mpd_url;
        const drm_keys = streamData.drm_keys;

        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
          showError('Browser not supported');
          return;
        }

        const video = document.querySelector('video');
        const player = new shaka.Player();
        await player.attach(video);

        const container = document.querySelector('.shaka-video-container');
        const ui = new shaka.ui.Overlay(player, container, video);

        ui.configure({
          controlPanelElements: [
            'time_and_duration',
            'spacer',
            'mute',
            'language',
            'captions',
            'picture_in_picture',
            'quality',
            'fullscreen'
          ]
        });

        const drmConfig = {
          clearKeys: drm_keys
        };

        player.configure({
          drm: drmConfig,
          streaming: {
            lowLatencyMode: true,
            bufferingGoal: 15,
            rebufferingGoal: 2,
            bufferBehind: 15,
            retryParameters: {
              timeout: 10000,
              maxAttempts: 5,
              baseDelay: 300,
              backoffFactor: 1.2
            },
            segmentRequestTimeout: 8000,
            segmentPrefetchLimit: 2,
            useNativeHlsOnSafari: true
          },
          manifest: {
            retryParameters: { timeout: 8000, maxAttempts: 3 }
          }
        });

        player.addEventListener('error', (event) => {
          console.error('Shaka Player Error:', event.detail);
          showError(event.detail.message || 'Failed to load stream');
        });

        await player.load(mpd_url);

        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => console.log("Autoplay blocked:", err));
        }

        unmuteBtn.addEventListener('click', handleUnmute);

      } catch (error) {
        console.error('Error:', error);
        showError(error.message);
      }
    }

    function handleUnmute() {
      if (!firstUnmuteOccurred) {
        const video = document.querySelector('video');
        video.muted = false;
        video.volume = 1;
        firstUnmuteOccurred = true;
        unmuteBtn.classList.add('fade-out'); // Uses the custom animation class to disappear
      }
    }

    function showError(message) {
      if (errorTimeout) {
        clearTimeout(errorTimeout);
      }
      
      errorBadge.textContent = `KNR SPORTVERSE: ${message}`;
      errorBadge.classList.add('show');
      
      errorTimeout = setTimeout(() => {
        errorBadge.classList.remove('show');
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', loadStream);
  </script>
</body>
</html>
