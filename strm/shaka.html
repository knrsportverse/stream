<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNR SPORTVERSE - STREAM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231D4ED8'/><stop offset='100%' stop-color='%2360A5FA'/></linearGradient></defs><rect x='4' y='4' width='52' height='52' rx='12' fill='url(%23grad)' stroke='white' stroke-width='1.5'/><text x='30' y='38' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='700' fill='white'>KNR</text></svg>">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" crossorigin="anonymous">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* ═══ GLASS CONTROL BAR STYLING ═══ */
    .shaka-controls-container {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.4) 50%, rgba(8, 12, 28, 0.65) 100%) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3) !important;
      border-radius: 12px 12px 0 0 !important;
    }

    .shaka-bottom-controls {
      background: transparent !important;
      backdrop-filter: none !important;
    }

    /* ═══ CONTROL BUTTONS ═══ */
    .shaka-controls-button {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 8px !important;
      color: rgba(255, 255, 255, 0.85) !important;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      padding: 8px 10px !important;
      margin: 0 4px !important;
    }

    .shaka-controls-button:hover {
      background: rgba(255, 255, 255, 0.14) !important;
      border-color: rgba(255, 255, 255, 0.24) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15) !important;
      transform: translateY(-1px) !important;
    }

    .shaka-controls-button.shaka-pressed {
      background: rgba(59, 130, 246, 0.25) !important;
      border-color: rgba(96, 165, 250, 0.4) !important;
      color: #60a5fa !important;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.25) !important;
    }

    .shaka-controls-button.shaka-pressed:hover {
      background: rgba(59, 130, 246, 0.35) !important;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35) !important;
    }

    /* ═══ SEEK BAR & PROGRESS ═══ */
    .shaka-seek-bar {
      background: rgba(255, 255, 255, 0.08) !important;
      border-radius: 4px !important;
      height: 4px !important;
      transition: height 0.2s ease !important;
    }

    .shaka-seek-bar:hover {
      height: 6px !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3) !important;
    }

    .shaka-seek-bar-played {
      background: linear-gradient(90deg, #3b82f6, #60a5fa) !important;
      border-radius: 4px !important;
      box-shadow: 0 0 8px rgba(96, 165, 250, 0.4) !important;
    }

    .shaka-seek-bar-buffered {
      background: rgba(96, 165, 250, 0.2) !important;
    }

    .shaka-seek-bar-container {
      transition: all 0.3s ease !important;
    }

    /* ═══ VOLUME SLIDER ═══ */
    .shaka-volume-bar {
      background: rgba(255, 255, 255, 0.1) !important;
      border-radius: 3px !important;
      height: 3px !important;
    }

    .shaka-volume-bar-filled {
      background: linear-gradient(90deg, #3b82f6, #60a5fa) !important;
      border-radius: 3px !important;
    }

    /* ═══ TIME DISPLAY ═══ */
    .shaka-current-time,
    .shaka-duration {
      color: rgba(255, 255, 255, 0.75) !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      letter-spacing: 0.3px !important;
    }

    .shaka-spacer {
      flex-grow: 1 !important;
    }

    /* ═══ MENU PANELS ═══ */
    .shaka-menu,
    .shaka-settings-menu,
    .shaka-overflow-menu {
      background: rgba(8, 12, 28, 0.92) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 12px !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
      color: rgba(255, 255, 255, 0.9) !important;
    }

    .shaka-menu-item {
      color: rgba(255, 255, 255, 0.75) !important;
      transition: all 0.2s ease !important;
      padding: 12px 16px !important;
      border-radius: 8px !important;
      margin: 4px 8px !important;
    }

    .shaka-menu-item:hover {
      background: rgba(59, 130, 246, 0.15) !important;
      color: #60a5fa !important;
      transform: translateX(2px) !important;
    }

    .shaka-menu-item.shaka-selected {
      background: rgba(59, 130, 246, 0.25) !important;
      color: #60a5fa !important;
      border-left: 2px solid #60a5fa !important;
    }

    /* ═══ ERROR BADGE ═══ */
    .error-badge {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 12, 28, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      z-index: 500;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: none;
      white-space: nowrap;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: glassSlideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes glassSlideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-12px);
        backdrop-filter: blur(0px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        backdrop-filter: blur(20px);
      }
    }

    .error-badge.show {
      display: block;
    }

    /* ═══ WATERMARK ═══ */
    .watermark {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 1.2px;
      z-index: 1000;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    /* ═══ UNMUTE BUTTON - PREMIUM APPLE GLASS ═══ */
    #unmuteBtn {
      display: flex;
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 30;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 9999px;
      background: rgba(8, 12, 28, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.2px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.36s cubic-bezier(0.4, 0, 0.2, 1);
      animation: unmuteGlassPulse 2.8s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    #unmuteBtn:hover {
      background: rgba(12, 18, 38, 0.88);
      border-color: rgba(96, 165, 250, 0.35);
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    #unmuteBtn:active {
      transform: scale(0.96) translateY(-1px);
    }

    #unmuteBtn.fade-out {
      opacity: 0 !important;
      transform: translateY(-12px) scale(0.88) !important;
      pointer-events: none;
      animation: none !important;
    }

    @keyframes unmuteGlassPulse {
      0%, 100% {
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      50% {
        border-color: rgba(96, 165, 250, 0.35);
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2), 0 0 20px rgba(59, 130, 246, 0.15);
      }
    }

    #unmuteBtn svg {
      flex-shrink: 0;
      transition: filter 0.3s ease;
    }

    #unmuteBtn:hover svg {
      filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.4));
    }

    /* ═══ TEXT STYLING ═══ */
    .shaka-text-container,
    .shaka-text-wrapper {
      font-family: system-ui, -apple-system, sans-serif !important;
      font-weight: 500 !important;
    }

    /* ═══ RESPONSIVE DESIGN ═══ */
    @media (max-width: 768px) {
      #unmuteBtn {
        padding: 8px 14px;
        font-size: 11px;
        gap: 6px;
      }

      #unmuteBtn svg {
        width: 13px !important;
        height: 13px !important;
      }

      .shaka-controls-button {
        padding: 6px 8px !important;
        margin: 0 3px !important;
      }

      .shaka-current-time,
      .shaka-duration {
        font-size: 12px !important;
      }
    }

    @media (max-width: 480px) {
      .error-badge {
        top: 10px;
        padding: 10px 16px;
        font-size: 12px;
        border-radius: 50px;
      }

      #unmuteBtn {
        padding: 7px 12px;
        font-size: 10px;
        gap: 5px;
        top: 12px;
        left: 12px;
      }

      #unmuteBtn svg {
        width: 12px !important;
        height: 12px !important;
      }

      .shaka-controls-button {
        padding: 5px 7px !important;
        margin: 0 2px !important;
        font-size: 11px !important;
      }
    }

    /* ═══ FULLSCREEN MODE ═══ */
    .shaka-video-container:fullscreen .shaka-controls-container {
      border-radius: 0 !important;
    }

    /* ═══ FOCUS STATES (ACCESSIBILITY) ═══ */
    .shaka-controls-button:focus,
    #unmuteBtn:focus {
      outline: 2px solid rgba(96, 165, 250, 0.5);
      outline-offset: 2px;
    }

    /* ═══ SMOOTH CONTROL BAR FADE ═══ */
    .shaka-controls-container.shaka-fade-out {
      opacity: 0.3;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .shaka-video-container.shaka-mouse-in .shaka-controls-container {
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>

<body>
  <div class="shaka-video-container" data-shaka-player>
    <video autoplay muted playsinline preload="metadata" poster=""></video>

    <!-- ═══ UNMUTE BUTTON ═══ -->
    <button id="unmuteBtn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"
           style="width:15px;height:15px;flex-shrink:0;color:#60a5fa;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
      <span>Click to Unmute</span>
    </button>

    <div class="watermark">WEBSITE: KNR SPORTVERSE</div>

    <div class="error-badge" id="errorBadge"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBII2OvFCMb2ZbtrUj_2DrhexUcU3TxSS0",
      authDomain: "knrstream-47104.firebaseapp.com",
      projectId: "knrstream-47104",
      storageBucket: "knrstream-47104.firebasestorage.app",
      messagingSenderId: "390036335226",
      appId: "1:390036335226:web:38584b0002f224021369c3",
      measurementId: "G-QD8RDB9CGC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const errorBadge = document.getElementById('errorBadge');
    const unmuteBtn = document.getElementById('unmuteBtn');
    let firstUnmuteOccurred = false;
    let errorTimeout = null;

    const params = new URLSearchParams(window.location.search);
    const streamId = params.get('q');

    if (!streamId) {
      showError('No stream ID provided. Use ?q=stream_id');
      throw new Error('No stream ID');
    }

    async function loadStream() {
      try {
        const q = query(collection(db, 'streams'), where('stream_id', '==', streamId));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          showError(`Stream "${streamId}" not found`);
          return;
        }

        const streamData = querySnapshot.docs[0].data();
        const mpd_url = streamData.mpd_url;
        const drm_keys = streamData.drm_keys;

        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
          showError('Browser not supported');
          return;
        }

        const video = document.querySelector('video');
        const player = new shaka.Player();
        await player.attach(video);

        const container = document.querySelector('.shaka-video-container');
        const ui = new shaka.ui.Overlay(player, container, video);

        ui.configure({
          controlPanelElements: [
            'time_and_duration',
            'spacer',
            'mute',
            'language',
            'captions',
            'picture_in_picture',
            'quality',
            'fullscreen'
          ]
        });

        const drmConfig = {
          clearKeys: drm_keys
        };

        player.configure({
          drm: drmConfig,
          streaming: {
            lowLatencyMode: true,
            bufferingGoal: 15,
            rebufferingGoal: 2,
            bufferBehind: 15,
            retryParameters: {
              timeout: 10000,
              maxAttempts: 5,
              baseDelay: 300,
              backoffFactor: 1.2
            },
            segmentRequestTimeout: 8000,
            segmentPrefetchLimit: 2,
            useNativeHlsOnSafari: true
          },
          manifest: {
            retryParameters: { timeout: 8000, maxAttempts: 3 }
          }
        });

        player.addEventListener('error', (event) => {
          console.error('Shaka Player Error:', event.detail);
          showError(event.detail.message || 'Failed to load stream');
        });

        await player.load(mpd_url);

        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => console.log("Autoplay blocked:", err));
        }

        unmuteBtn.addEventListener('click', handleUnmute);

      } catch (error) {
        console.error('Error:', error);
        showError(error.message);
      }
    }

    function handleUnmute() {
      if (!firstUnmuteOccurred) {
        const video = document.querySelector('video');
        video.muted = false;
        video.volume = 1;
        firstUnmuteOccurred = true;
        unmuteBtn.classList.add('fade-out');
      }
    }

    function showError(message) {
      if (errorTimeout) {
        clearTimeout(errorTimeout);
      }

      errorBadge.textContent = `KNR SPORTVERSE: ${message}`;
      errorBadge.classList.add('show');

      errorTimeout = setTimeout(() => {
        errorBadge.classList.remove('show');
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', loadStream);
  </script>
</body>
</html>
