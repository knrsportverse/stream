<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KNRSPORTVERSE · Channel Player</title>
<link rel="stylesheet" href="https://cinevid.st/cv-player.css?v=82c1172af1">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
</head>
<body>

<script>
  /* ==========================================
     1. EMBED GUARD (Decoded from embed-guard.js)
     ========================================== */
  (function () {
    'use strict';
    const docEl = document.documentElement;
    const hasFrameElement = !!(docEl && docEl.getAttribute && docEl.getAttribute('data-embed-guard') === 'true');
    let isNestedInParent = false;

    try {
      let currentWin = window;
      while (currentWin.parent !== currentWin) {
        currentWin = currentWin.parent;
        if (currentWin.location.protocol !== window.location.protocol) {
          isNestedInParent = true;
          break;
        }
      }
    } catch (e) {
      isNestedInParent = true;
    }

    window.embedGuardChecked = isNestedInParent;
    window.embedGuardAllowed = !isNestedInParent || hasFrameElement;

    if (isNestedInParent && !hasFrameElement) {
      document.body.style.overflow = 'hidden';
      function displayEmbedBlockWarning() {
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0b0b0b;color:#fff;font-family:sans-serif;text-align:center;padding:20px;"><h2>Embedding Restricted</h2><p>This content cannot be displayed in this frame.</p></div>';
        document.body.style.overflow = '';
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', displayEmbedBlockWarning);
      } else {
        displayEmbedBlockWarning();
      }
    }
  })();
</script>

<script>
  /* ==========================================
     2. STREAM DECRYPTOR & UNWRAPPER (Decoded from cv-unwrap.js)
     ========================================== */
  (function () {
    'use strict';

    async function decompressAndDecryptStream(buffer) {
      const uint8 = new Uint8Array(buffer);
      if (!uint8.length) return buffer;
      try {
        // Decompression & byte-stream decryption mapping
        const ds = new DecompressionStream('gzip');
        const blobStream = new Response(new Blob([uint8]).stream().pipeThrough(ds));
        const decompressed = await blobStream.arrayBuffer();
        return new Uint8Array(decompressed);
      } catch (err) {
        return buffer;
      }
    }

    class CustomHlsLoader extends class {} {
      // HLS custom segment loader interception for decryption
      constructor(config) {
        super(config);
      }
    }

    window.cv_map = {
      decrypt: decompressAndDecryptStream,
      loader: function(BaseLoader) {
        return class DecryptingLoader extends BaseLoader {
          load(context, config, callbacks) {
            const originalOnSuccess = callbacks.onSuccess;
            callbacks.onSuccess = function(response, stats, context, networkDetails) {
              if (!(response.data instanceof ArrayBuffer)) {
                return originalOnSuccess(response, stats, context, networkDetails);
              }
              decompressAndDecryptStream(response.data).then(function(decrypted) {
                response.data = decrypted;
                originalOnSuccess(response, stats, context, networkDetails);
              });
            };
            super.load(context, config, callbacks);
          }
        };
      }
    };
  })();
</script>

<script>
  /* ==========================================
     3. PLAYER INITIALIZATION & UI CONTROLS (Decoded from cv-player.js)
     ========================================== */
  (function () {
    'use strict';

    // Check embed guard status before mounting player
    if (window.embedGuardChecked === false && window.embedGuardAllowed === false) return;

    // Extract channel identifier from URL path
    const pathParts = location.pathname.split('/');
    const channelId = decodeURIComponent(pathParts[pathParts.length - 1] || '').trim();
    const apiEndpoint = typeof CVPlayer !== 'undefined' && CVPlayer.endpoint ? CVPlayer.endpoint : 'https://cinevid.st';

    // Initialize CVPlayer with dynamic stream resolution
    CVPlayer({
      title: '',
      storeKey: 'cv_channel_' + channelId,
      remember: false,
      auto: true,
      load: async function () {
        let channelData = null;
        let activeChannelId = channelId;

        try {
          const response = await fetch(apiEndpoint + '/channels');
          const data = await response.json();
          channelData = (data.channels || []).find(ch => String(ch.id) === channelId || ch.slug === channelId);
        } catch (err) {}

        if (channelData) {
          activeChannelId = String(channelData.id);
          document.title = channelData.name;
        }

        let streams = Object.keys(channelData && channelData.streams || {}).filter(key => channelData.streams[key] === true);

        if (!streams.length) {
          streams = [activeChannelId.indexOf('T') === 0 ? 'primary' : 'default'];
        }

        return streams.map(function (streamKey, index) {
          return {
            name: 'Stream ' + (index + 1),
            key: streamKey,
            resolve: async function (signal) {
              const res = await fetch(apiEndpoint + '/channel/' + activeChannelId + '/' + streamKey + '/' + encodeURIComponent(activeChannelId), {
                cache: 'default',
                signal: signal
              });
              if (!res.ok) return null;
              const json = await res.json();
              return json && json.url ? CVPlayer.unwrap(String(json.url)) : null;
            }
          };
        });
      }
    });
  })();
</script>

</body>
</html>
