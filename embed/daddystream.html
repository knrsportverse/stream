<!DOCTYPE html>
<html class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KNR SPORTVERSE - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary-blue: #1e88e5;
      --primary-dark-blue: #1565c0;
      --secondary-blue: #42a5f5;
      --light-blue: #e3f2fd;
      --text-dark: #1a1a1a;
      --text-light: #666666;
      --bg-light: #f5f7fa;
      --bg-card: #ffffff;
      --header-bg: #0d1b2a;
      --border-color: #e0e0e0;
      --dark-text: #f0f0f0;
      --dark-bg: #0a0e27;
      --dark-bg-card: #1a1f3a;
      --dark-header-bg: #0a0d16;
      --dark-border-color: #2a3a4a;
    }

    html, body {
      background: var(--dark-bg);
      font-family: 'Poppins', sans-serif;
      color: var(--dark-text);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--dark-header-bg) 0%, #111827 100%);
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(30, 136, 229, 0.1);
      border: 1px solid rgba(66, 165, 245, 0.15);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .user-info {
      font-size: 13px;
      color: #94a3b8;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    /* Auth Page */
    .auth-container {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 39, 0.85);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .auth-box {
      background: var(--dark-bg-card);
      padding: 35px;
      border-radius: 15px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(30, 136, 229, 0.2);
      border: 1px solid var(--dark-border-color);
    }

    .auth-box h2 {
      margin-bottom: 10px;
      color: var(--dark-text);
      text-align: center;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--dark-border-color);
      border-radius: 10px;
      font-size: 14px;
      color: var(--dark-text);
      font-family: 'Poppins', sans-serif;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 15px rgba(30, 136, 229, 0.3);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-dark-blue) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(30, 136, 229, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 136, 229, 0.5);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--dark-border-color);
      color: #cbd5e1;
      margin-top: 10px;
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .error {
      color: #ef4444;
      font-size: 12px;
      margin-top: 5px;
      font-weight: 500;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    /* Main Content */
    .main-content {
      display: none;
    }

    .main-content.show {
      display: block;
    }

    /* Sections */
    .section {
      background: var(--dark-bg-card);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(30, 136, 229, 0.15);
      border: 1px solid var(--dark-border-color);
    }

    .section h2 {
      color: var(--dark-text);
      font-size: 1.2rem;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--dark-border-color);
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    /* Streams Grid / Cards */
    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .stream-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--dark-border-color);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stream-card:hover {
      border-color: var(--primary-blue);
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(30, 136, 229, 0.2);
    }

    .stream-id {
      font-weight: 700;
      color: var(--secondary-blue);
      font-size: 1.1rem;
    }

    .stream-url {
      font-size: 12px;
      color: #94a3b8;
      word-break: break-all;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stream-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-edit {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .btn-edit:hover {
      background: #3b82f6;
      color: white;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-delete:hover {
      background: #ef4444;
      color: white;
    }

    .btn-copy {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .btn-copy:hover {
      background: #10b981;
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      grid-column: 1 / -1;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 39, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--dark-bg-card);
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border: 1px solid var(--dark-border-color);
    }

    .modal-content h3 {
      color: var(--dark-text);
      margin-bottom: 20px;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--dark-border-color);
      padding-bottom: 10px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 15px;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 15px; }
      .header { flex-direction: column; text-align: center; }
      .form-row { grid-template-columns: 1fr; }
      .auth-box, .modal-content { margin: 15px; max-width: none; }
    }
  </style>
</head>

<body>
  <!-- Auth Modal -->
  <div class="auth-container" id="authContainer">
    <div class="auth-box">
      <div style="text-align: center; margin-bottom: 20px;">
        <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: var(--primary-blue);"></i>
      </div>
      <h2>KNR SPORTVERSE</h2>
      <p style="text-align: center; color: #94a3b8; margin-bottom: 25px; font-size: 13px;">Admin Access Control</p>
      
      <div id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>
        <div id="loginError" class="error"></div>
        <button class="btn" id="loginBtn" style="margin-top: 10px;">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <div class="container">
      <div class="header">
        <h1>
          <i class="fa-solid fa-tv" style="color: var(--secondary-blue);"></i>
          KNR SPORTVERSE - Admin Panel
        </h1>
        <div style="display: flex; align-items: center; gap: 15px;">
          <div class="user-info">Logged in: <span id="userEmail" style="color: var(--dark-text); font-weight: 500;"></span></div>
          <button class="logout-btn" id="logoutBtn">Sign Out</button>
        </div>
      </div>

      <!-- Add New Stream -->
      <div class="section">
        <h2>
          <i class="fa-solid fa-plus-circle" style="color: var(--primary-blue);"></i>
          Add New Stream
        </h2>
        <div class="form-row">
          <div class="form-group">
            <label>Stream ID</label>
            <input type="text" id="streamId" placeholder="e.g., stream_001">
          </div>
          <div class="form-group">
            <label>MPD Link</label>
            <input type="url" id="streamMpd" placeholder="https://example.com/stream.mpd">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>DRM Key 1</label>
            <input type="text" id="streamDrm1" placeholder="e.g., cfd...">
          </div>
          <div class="form-group">
            <label>DRM Value 1</label>
            <input type="text" id="streamDrmVal1" placeholder="e.g., cfd ...">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>DRM Key 2 (Optional)</label>
            <input type="text" id="streamDrm2" placeholder="DRM Key 2">
          </div>
          <div class="form-group">
            <label>DRM Value 2 (Optional)</label>
            <input type="text" id="streamDrmVal2" placeholder="DRM Value 2">
          </div>
        </div>
        <div id="addSuccess" class="success" style="display: none;"></div>
        <div id="addError" class="error"></div>
        <button class="btn" id="addStreamBtn">Add Stream</button>
      </div>

      <!-- Streams List -->
      <div class="section">
        <h2>
          <i class="fa-solid fa-list-check" style="color: var(--primary-blue);"></i>
          Manage Streams
        </h2>
        <div class="streams-grid" id="streamsContainer">
          <div class="empty-state">
            <p>Loading streams...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>Edit Stream</h3>
      <div class="form-group">
        <label>Stream ID</label>
        <input type="text" id="editStreamId" disabled style="opacity: 0.7;">
      </div>
      <div class="form-group">
        <label>MPD Link</label>
        <input type="url" id="editStreamMpd">
      </div>
      <div class="form-group">
        <label>DRM Key 1</label>
        <input type="text" id="editStreamDrm1">
      </div>
      <div class="form-group">
        <label>DRM Value 1</label>
        <input type="text" id="editStreamDrmVal1">
      </div>
      <div class="form-group">
        <label>DRM Key 2</label>
        <input type="text" id="editStreamDrm2">
      </div>
      <div class="form-group">
        <label>DRM Value 2</label>
        <input type="text" id="editStreamDrmVal2">
      </div>
      <div id="editError" class="error"></div>
      <div class="modal-actions">
        <button class="btn" id="saveEditBtn">Save Changes</button>
        <button class="btn secondary" id="cancelEditBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBII2OvFCMb2ZbtrUj_2DrhexUcU3TxSS0",
      authDomain: "knrstream-47104.firebaseapp.com",
      projectId: "knrstream-47104",
      storageBucket: "knrstream-47104.appspot.com",
      messagingSenderId: "390036335226",
      appId: "1:390036335226:web:38584b0002f224021369c3",
      measurementId: "G-QD8RDB9CGC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const authContainer = document.getElementById('authContainer');
    const mainContent = document.getElementById('mainContent');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const addStreamBtn = document.getElementById('addStreamBtn');
    const streamsContainer = document.getElementById('streamsContainer');
    const editModal = document.getElementById('editModal');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const saveEditBtn = document.getElementById('saveEditBtn');
    const userEmail = document.getElementById('userEmail');

    let currentUser = null;
    let currentEditId = null;
    let streamsDataMap = {}; // FIX: Store full stream data objects safely to avoid string quoting/escaping breakdown in inline HTML attributes.

    // Check if user is already logged in (from localStorage)
    function checkLoginState() {
      const savedUser = localStorage.getItem('knr_user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          currentUser = user;
          authContainer.style.display = 'none';
          mainContent.classList.add('show');
          userEmail.textContent = user.email;
          loadStreams();
        } catch (e) {
          localStorage.removeItem('knr_user');
        }
      }
    }

    // Auth State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const userData = {
          uid: user.uid,
          email: user.email
        };
        localStorage.setItem('knr_user', JSON.stringify(userData));
        authContainer.style.display = 'none';
        mainContent.classList.add('show');
        userEmail.textContent = user.email;
        loadStreams();
      } else {
        currentUser = null;
        localStorage.removeItem('knr_user');
        authContainer.style.display = 'flex';
        mainContent.classList.remove('show');
      }
    });

    checkLoginState();

    // Login
    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');

      if (!email || !password) {
        errorDiv.textContent = 'Please fill all fields';
        return;
      }

      loginBtn.classList.add('loading');
      try {
        await signInWithEmailAndPassword(auth, email, password);
        errorDiv.textContent = '';
      } catch (error) {
        errorDiv.textContent = error.message;
      }
      loginBtn.classList.remove('loading');
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      localStorage.removeItem('knr_user');
      await signOut(auth);
    });

    // Add Stream
    addStreamBtn.addEventListener('click', async () => {
      const id = document.getElementById('streamId').value;
      const mpd = document.getElementById('streamMpd').value;
      const drm1Key = document.getElementById('streamDrm1').value;
      const drm1Val = document.getElementById('streamDrmVal1').value;
      const drm2Key = document.getElementById('streamDrm2').value;
      const drm2Val = document.getElementById('streamDrmVal2').value;
      const errorDiv = document.getElementById('addError');
      const successDiv = document.getElementById('addSuccess');

      if (!id || !mpd || !drm1Key || !drm1Val) {
        errorDiv.textContent = 'Please fill required fields';
        return;
      }

      addStreamBtn.classList.add('loading');
      try {
        const drmObj = {
          [drm1Key]: drm1Val
        };
        if (drm2Key && drm2Val) {
          drmObj[drm2Key] = drm2Val;
        }

        await addDoc(collection(db, 'streams'), {
          stream_id: id,
          mpd_url: mpd,
          drm_keys: drmObj,
          created_at: new Date(),
          user_id: currentUser.uid
        });

        errorDiv.textContent = '';
        successDiv.textContent = 'Stream added successfully!';
        successDiv.style.display = 'block';
        setTimeout(() => successDiv.style.display = 'none', 3000);

        document.getElementById('streamId').value = '';
        document.getElementById('streamMpd').value = '';
        document.getElementById('streamDrm1').value = '';
        document.getElementById('streamDrmVal1').value = '';
        document.getElementById('streamDrm2').value = '';
        document.getElementById('streamDrmVal2').value = '';

        loadStreams();
      } catch (error) {
        errorDiv.textContent = 'Error: ' + error.message;
      }
      addStreamBtn.classList.remove('loading');
    });

    // Load Streams
    async function loadStreams() {
      try {
        const q = query(collection(db, 'streams'), orderBy('created_at', 'desc'));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          streamsContainer.innerHTML = '<div class="empty-state"><p>No streams yet. Add one above!</p></div>';
          return;
        }

        streamsContainer.innerHTML = '';
        streamsDataMap = {}; // Reset local cache map

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          streamsDataMap[docSnap.id] = data; // Store data in map by document ID
          
          const streamUrl = `https://knrstream.pages.dev/strm/player/?q=${data.stream_id}`;
          
          const card = document.createElement('div');
          card.className = 'stream-card';
          card.innerHTML = `
            <div class="stream-id">${data.stream_id}</div>
            <div class="stream-url">URL: <strong>player.html?q=${data.stream_id}</strong></div>
            <div class="stream-url">MPD: ${data.mpd_url}</div>
            <div class="stream-actions">
              <button class="btn-small btn-copy" onclick="copyToClipboard('${streamUrl}')">
                <i class="fa-solid fa-copy"></i> Copy
              </button>
              <button class="btn-small btn-edit" data-id="${docSnap.id}">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
              <button class="btn-small btn-delete" onclick="deleteStream('${docSnap.id}')">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </div>
          `;
          
          // Attach safe event listener for the edit button to avoid inline JSON parsing errors
          card.querySelector('.btn-edit').addEventListener('click', () => {
            editStream(docSnap.id, streamsDataMap[docSnap.id]);
          });

          streamsContainer.appendChild(card);
        });
      } catch (error) {
        streamsContainer.innerHTML = '<div class="empty-state"><p>Error loading streams</p></div>';
        console.error('Load error:', error);
      }
    }

    // Edit Stream function fix
    function editStream(docId, data) {
      currentEditId = docId;
      document.getElementById('editStreamId').value = data.stream_id || '';
      document.getElementById('editStreamMpd').value = data.mpd_url || '';
      
      // Clear previous modal inputs
      document.getElementById('editStreamDrm1').value = '';
      document.getElementById('editStreamDrmVal1').value = '';
      document.getElementById('editStreamDrm2').value = '';
      document.getElementById('editStreamDrmVal2').value = '';

      if (data.drm_keys) {
        const keys = Object.keys(data.drm_keys);
        if (keys.length > 0) {
          document.getElementById('editStreamDrm1').value = keys[0];
          document.getElementById('editStreamDrmVal1').value = data.drm_keys[keys[0]] || '';
        }
        if (keys.length > 1) {
          document.getElementById('editStreamDrm2').value = keys[1];
          document.getElementById('editStreamDrmVal2').value = data.drm_keys[keys[1]] || '';
        }
      }

      editModal.classList.add('show');
    };

    // Save Edit
    saveEditBtn.addEventListener('click', async () => {
      const mpd = document.getElementById('editStreamMpd').value;
      const drm1Key = document.getElementById('editStreamDrm1').value;
      const drm1Val = document.getElementById('editStreamDrmVal1').value;
      const drm2Key = document.getElementById('editStreamDrm2').value;
      const drm2Val = document.getElementById('editStreamDrmVal2').value;
      const errorDiv = document.getElementById('editError');

      if (!mpd || !drm1Key || !drm1Val) {
        errorDiv.textContent = 'Please fill required fields';
        return;
      }

      saveEditBtn.classList.add('loading');
      try {
        const drmObj = {
          [drm1Key]: drm1Val
        };
        if (drm2Key && drm2Val) {
          drmObj[drm2Key] = drm2Val;
        }

        await updateDoc(doc(db, 'streams', currentEditId), {
          mpd_url: mpd,
          drm_keys: drmObj
        });

        errorDiv.textContent = '';
        editModal.classList.remove('show');
        loadStreams();
      } catch (error) {
        errorDiv.textContent = 'Error: ' + error.message;
      }
      saveEditBtn.classList.remove('loading');
    });

    // Delete Stream
    window.deleteStream = async function(docId) {
      if (!confirm('Are you sure you want to delete this stream?')) return;

      try {
        await deleteDoc(doc(db, 'streams', docId));
        loadStreams();
      } catch (error) {
        alert('Error deleting stream: ' + error.message);
      }
    };

    // Copy to Clipboard
    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard!');
    };

    // Close Modal
    cancelEditBtn.addEventListener('click', () => {
      editModal.classList.remove('show');
    });
  </script>
</body>
</html>
